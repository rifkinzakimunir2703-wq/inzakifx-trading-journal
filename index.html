<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InzakiFX Trading Journal</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<header class="topbar">
  <div><b><span>Inzaki</span>FX</b><small>Trading Journal V2</small></div>
  <button id="logoutBtn" class="secondary hidden">Logout</button>
</header>

<main class="container">
  <section id="authView" class="panel auth">
    <h1>InzakiFX Journal</h1>
    <p class="muted">Simpan jurnal trading kamu secara online.</p>
    <div class="tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>
    <form id="authForm">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password (min. 6 karakter)" minlength="6" required>
      <input id="displayName" class="registerOnly hidden" placeholder="Nama tampilan">
      <button id="authSubmit" type="submit">Login</button>
    </form>
    <p id="authMsg" class="msg"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="hero">
      <div>
        <h1>Trading Journal</h1>
        <p class="muted">Catat, evaluasi, dan pantau performa trading kamu.</p>
      </div>
      <div class="actions">
        <button id="addTradeBtn">+ Tambah Trade</button>
        <button id="exportBtn" class="secondary">Export CSV</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><small>Total Trade</small><strong id="totalTrades">0</strong></div>
      <div class="card"><small>Win Rate</small><strong id="winRate">0%</strong></div>
      <div class="card"><small>Net P/L</small><strong id="netPL">$0.00</strong></div>
      <div class="card"><small>Profit Factor</small><strong id="profitFactor">0.00</strong></div>
      <div class="card"><small>Max Drawdown</small><strong id="maxDD">$0.00</strong></div>
      <div class="card"><small>Best Day</small><strong id="bestDay">$0.00</strong></div>
    </div>

    <section class="panel">
      <div class="sectionTitle"><h2>Equity Curve</h2><span id="equityLabel">$0.00</span></div>
      <canvas id="equityChart"></canvas>
    </section>

    <section class="panel">
      <div class="sectionTitle"><h2>Trade History</h2><input id="search" placeholder="Cari symbol/strategy..."></div>
      <div id="tradeList" class="tradeList"></div>
    </section>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <div class="sectionTitle"><h2>Tambah Trade</h2><button id="closeModal" class="secondary">×</button></div>
    <form id="tradeForm" class="gridForm">
      <input id="tSymbol" placeholder="Symbol (XAUUSD, NASDAQ...)" required>
      <select id="tSide"><option>BUY</option><option>SELL</option></select>
      <input id="tEntry" type="number" step="any" placeholder="Entry">
      <input id="tExit" type="number" step="any" placeholder="Exit">
      <input id="tRisk" type="number" step="any" placeholder="Risk $">
      <input id="tPL" type="number" step="any" placeholder="P/L $" required>
      <input id="tStrategy" placeholder="Strategy">
      <input id="tTF" placeholder="Timeframe (5M, 15M...)">
      <input id="tSession" placeholder="Session (Asia/London/NY)">
      <textarea id="tNotes" placeholder="Catatan"></textarea>
      <button type="submit">Simpan Trade</button>
    </form>
    <p id="tradeMsg" class="msg"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
